[versions]
agp = "8.5.2"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.27"
hilt = "2.52"
hiltNavigationCompose = "1.2.0"
compose-bom = "2024.09.03"
navigation = "2.8.3"
room = "2.6.1"
mlkit-text = "16.0.1"
pdfbox = "2.0.27.0"
coroutines = "1.9.0"
lifecycle = "2.8.6"
datastore = "1.1.1"

[libraries]
